# NOTE: `policy_tags:` on a column below is a TOP-LEVEL column property
# (a plain list), not nested under `config:`. Verified against installed
# dbt-core 1.12.5 (dbt/parser/common.py ParserRef._add only copies
# column.config["meta"]/["tags"] into the compiled ColumnConfig — any other
# key nested under `config:`, including a `config.policy_tags`, is silently
# dropped and never reaches the manifest) and dbt-bigquery 1.12.1
# (impl.py's _update_column_dict reads `policy_tags` off the top-level
# column dict when persisting docs via `dbt run`). Confirmed empirically:
# `dbt parse --vars '{"pii_high": "dummy_pii_high", ...}'` produces a
# compiled manifest.json with `dummy_pii_high` present in each column's
# top-level `policy_tags`, and absent when nested under `config:`.
version: 2

models:
  - name: customers
    description: One row per customer.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        tests: [not_null, unique]
      - name: full_name
        description: Customer's full name.
        policy_tags:
          - "{{ var('pii_high') }}"
        config:
          meta:
            sensitivity: pii_high
            owner: governance
      - name: email
        description: Customer's email address.
        policy_tags:
          - "{{ var('pii_high') }}"
        config:
          meta:
            sensitivity: pii_high
            owner: governance
      - name: phone
        description: Customer's phone number.
        policy_tags:
          - "{{ var('pii_high') }}"
        config:
          meta:
            sensitivity: pii_high
            owner: governance
      - name: region
        description: Customer's region.
        tests:
          - accepted_values:
              arguments:
                values: ['East', 'West', 'Central']
      - name: signup_date
        description: Date the customer signed up.
      - name: tier
        description: Customer's account tier.

  - name: orders
    description: One row per order, denormalized with the customer's region.
    columns:
      - name: order_id
        description: Unique order identifier.
        tests: [not_null, unique]
      - name: customer_id
        description: Foreign key to customers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: amount
        description: Order amount in USD.
      - name: status
        description: Order status.
      - name: region
        description: Denormalized from customers via the staging-layer join.

  - name: support_tickets
    description: One row per support ticket, denormalized with the customer's region.
    columns:
      - name: ticket_id
        description: Unique ticket identifier.
        tests: [not_null, unique]
      - name: customer_id
        description: Foreign key to customers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id
      - name: created_at
        description: Timestamp the ticket was created.
      - name: category
        description: Ticket category.
      - name: priority
        description: Ticket priority.
      - name: body
        description: Ticket body text. Contains planted canary PII for leak-detection evals.
        config:
          meta:
            sensitivity: pii_high
            owner: governance
      - name: region
        description: Denormalized from customers via the staging-layer join.
