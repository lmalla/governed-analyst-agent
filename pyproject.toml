[project]
name = "governed-analyst-agent"
version = "0.1.0"
description = "Governed text-to-SQL agent prototype over BigQuery (Claude Agent SDK)."
requires-python = ">=3.11"
dependencies = [
    "faker>=30.0",
    "dbt-bigquery>=1.8",
    "pyyaml>=6.0",
    "requests>=2.32",
    "google-auth>=2.35",
    "google-cloud-bigquery>=3.26",
    "sqlglot>=25.0",
    "claude-agent-sdk>=0.2.154",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Numbered pipeline scripts (matching scripts/00_preflight.sh's convention)
# are invoked directly via `uv run python scripts/NN_*.py`, never imported
# as a module, so the leading digit in the filename is intentional.
"scripts/[0-9][0-9]_*.py" = ["N999"]
